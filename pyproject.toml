[project]
name = "assistant"
version = "0.1.0"
description = "Voice assistant for tasks and meetings: LLM agent, MCP tools and ASR"
readme = "README.md"
authors = [
    { name = "LEONIDOS", email = "ltosevikov@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.148",
    "fastmcp>=4.1",
    "langchain>=1.4",
    "langchain-gigachat>=0.5",
    "prometheus-client>=0.26",
    "pydantic-settings>=2.16",
    "python-multipart>=0.0.32",
    "redis>=8.1",
    "tzdata>=2026.5",
    "uvicorn>=0.54",
]

[project.optional-dependencies]
asr = [
    "gigaam[torch]",
]

[build-system]
requires = ["uv_build>=0.10.3,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # Cyrillic in strings/comments is intentional

[tool.ruff.lint.per-file-ignores]
"src/assistant/llm/prompts.py" = ["E501"]  # prompt text is kept as natural paragraphs

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.uv.sources]
gigaam = { git = "https://github.com/salute-developers/GigaAM", rev = "7447938d791c4f3e643386ee22c33777004293a5" }
