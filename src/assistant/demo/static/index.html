<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ассистент — демо ML</title>
<style>
  :root {
    --bg: #f6f6f4; --panel: #ffffff; --text: #1d1d1b; --muted: #6b6b66;
    --border: #e2e2dc; --accent: #2f6fde; --user: #e8effc; --rec: #d64545; --debug: #f0f0eb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161615; --panel: #1f1f1d; --text: #ececea; --muted: #9a9a94;
      --border: #33332f; --accent: #6b9bf0; --user: #22314d; --rec: #e06060; --debug: #262624;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 16px; display: flex; flex-direction: column; height: 100dvh; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
  h1 { font-size: 18px; margin: 0; }
  header label { color: var(--muted); font-size: 13px; }
  #log { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding: 4px 0 12px; }
  .msg { max-width: 85%; padding: 10px 12px; border-radius: 12px; background: var(--panel); border: 1px solid var(--border); }
  .msg.user { align-self: flex-end; background: var(--user); border-color: transparent; }
  .msg.error { border-color: var(--rec); }
  .debug { margin-top: 6px; padding: 6px 8px; border-radius: 6px; background: var(--debug);
           font: 12px/1.4 ui-monospace, Consolas, monospace; color: var(--muted); white-space: pre-wrap; word-break: break-word; }
  form { display: flex; gap: 8px; }
  input[type=text] { flex: 1; min-width: 0; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border);
                     background: var(--panel); color: var(--text); font: inherit; }
  button { padding: 10px 14px; border-radius: 10px; border: 1px solid var(--border); background: var(--panel);
           color: var(--text); font: inherit; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button#mic.recording { background: var(--rec); border-color: var(--rec); color: #fff; }
  button:disabled { opacity: .5; cursor: default; }
  .hint { color: var(--muted); font-size: 13px; margin: 8px 0 0; }
  .msg.status { color: var(--muted); font-style: italic; display: flex; align-items: center; gap: 8px; }
  .msg.status.recording { color: var(--rec); font-style: normal; }
  .dots { display: inline-flex; gap: 3px; }
  .dots i { width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: .3;
            animation: blink 1.2s infinite; }
  .dots i:nth-child(2) { animation-delay: .2s; }
  .dots i:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 40% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .dots i { animation: none; opacity: .7; } }
  .elapsed { font-variant-numeric: tabular-nums; font-style: normal; font-size: 13px; }
  .msg .meta { margin-top: 4px; font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
<main>
  <header>
    <h1>Голосовой ассистент · демо ML</h1>
    <div>
      <label><input type="checkbox" id="showDebug" checked> отладка</label>
      <button type="button" id="reset">Сброс диалога</button>
    </div>
  </header>
  <div id="log" aria-live="polite"></div>
  <form id="form">
    <button type="button" id="mic" aria-label="Записать голос">🎙</button>
    <input type="text" id="text" placeholder="Например: напомни завтра в 10 позвонить Ивану" autocomplete="off">
    <button class="primary" id="send">Отправить</button>
  </form>
  <p class="hint">Нажмите 🎙, скажите запрос и нажмите ещё раз. До 25 секунд.</p>
</main>
<script>
const log = document.getElementById("log");
const textInput = document.getElementById("text");
const mic = document.getElementById("mic");
const send = document.getElementById("send");

function add(role, text, debug) {
  const div = document.createElement("div");
  div.className = "msg " + role;
  div.textContent = text;
  if (debug && document.getElementById("showDebug").checked) {
    const pre = document.createElement("div");
    pre.className = "debug";
    pre.textContent = debug;
    div.appendChild(pre);
  }
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
}

function debugText(r) {
  const lines = (r.tool_calls || []).map(c => `↳ ${c.name}(${JSON.stringify(c.args)})`);
  const asr = r.asr_latency_s != null ? `ASR ${r.asr_latency_s.toFixed(1)}s · ` : "";
  if (r.latency_s != null) {
    lines.push(`${asr}LLM ${r.latency_s.toFixed(1)}s · ${r.input_tokens}+${r.output_tokens} tok · ${r.cost_rub.toFixed(3)} ₽`);
  }
  return lines.join("\n");
}

// A temporary bubble that shows what the assistant is doing right now, with a running timer.
function showStatus(text, extraClass = "") {
  const div = document.createElement("div");
  div.className = "msg status " + extraClass;
  div.setAttribute("role", "status");
  const label = document.createElement("span");
  label.textContent = text;
  const dots = document.createElement("span");
  dots.className = "dots";
  dots.innerHTML = "<i></i><i></i><i></i>";
  const elapsed = document.createElement("span");
  elapsed.className = "elapsed";
  div.append(label, dots, elapsed);
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
  const started = performance.now();
  const timer = setInterval(() => {
    elapsed.textContent = ((performance.now() - started) / 1000).toFixed(1) + " с";
  }, 100);
  return {
    set(newText) { label.textContent = newText; },
    done() { clearInterval(timer); div.remove(); },
  };
}

function setBusy(busy) {
  send.disabled = busy;
  textInput.disabled = busy;
  if (!recorder) mic.disabled = busy;
}

async function request(url, options) {
  const res = await fetch(url, options);
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(body.detail || `Ошибка ${res.status}`);
  return body;
}

async function ask(text, asrLatency) {
  const status = showStatus("Обрабатываю запрос");
  try {
    const r = await request("/api/chat", {
      method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({text}),
    });
    status.done();
    add("assistant", r.text, debugText({...r, asr_latency_s: asrLatency}));
  } catch (e) {
    status.done();
    add("assistant error", e.message);
  }
}

document.getElementById("form").addEventListener("submit", async e => {
  e.preventDefault();
  const text = textInput.value.trim();
  if (!text) return;
  textInput.value = "";
  add("user", text);
  setBusy(true);
  await ask(text);
  setBusy(false);
  textInput.focus();
});

async function recognizeAndAsk(blob, filename) {
  setBusy(true);
  const status = showStatus("Распознаю речь");
  try {
    const form = new FormData();
    form.append("audio", blob, filename);
    const t = await request("/api/transcribe", {method: "POST", body: form});
    status.done();
    if (!t.transcript) {
      add("assistant", "Не расслышал, повторите, пожалуйста.");
      return;
    }
    add("user", t.transcript);
    await ask(t.transcript, t.asr_latency_s);
  } catch (e) {
    status.done();
    add("assistant error", e.message);
  } finally {
    setBusy(false);
  }
}

let recorder = null;
let recordingStatus = null;
mic.addEventListener("click", async () => {
  if (recorder) { recorder.stop(); return; }
  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({audio: true});
  } catch {
    add("assistant error", "Нет доступа к микрофону");
    return;
  }
  const chunks = [];
  recorder = new MediaRecorder(stream);
  recorder.ondataavailable = e => chunks.push(e.data);
  recorder.onstop = () => {
    stream.getTracks().forEach(t => t.stop());
    mic.classList.remove("recording");
    mic.textContent = "🎙";
    recordingStatus.done();
    const type = recorder.mimeType.split(";")[0] || "audio/webm";
    recorder = null;
    recognizeAndAsk(new Blob(chunks, {type}), "voice" + (type.includes("mp4") ? ".m4a" : ".webm"));
  };
  recorder.start();
  mic.classList.add("recording");
  mic.textContent = "⏹";
  recordingStatus = showStatus("Идёт запись, нажмите ⏹, чтобы закончить", "recording");
  setTimeout(() => recorder && recorder.stop(), 25000);
});

document.getElementById("reset").addEventListener("click", async () => {
  await fetch("/api/reset", {method: "POST"});
  log.innerHTML = "";
});
</script>
</body>
</html>
